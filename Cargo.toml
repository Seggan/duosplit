[package]
name = "duosplit"
version = "0.4.1"
description = "A tool for splitting dual-narrowband hydrogen-alpha and oxygen-III images."
edition = "2021"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }

rand = "0.10.3"
fitrs = "0.5.0"
ndarray = "0.17.2"

wgpu = "30.0.1"
pollster = { version = "1.0.1" }
flume = "0.12.0"
bytemuck = "1.14"

thiserror = "2.0.20"
anyhow = { version = "1.0.104", features = ["backtrace"] }
